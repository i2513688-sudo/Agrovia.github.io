{% extends "base.html" %}
{% block title %}{{ _('Recuperar contraseña') }}{% endblock %}
{% block content %}
<main class="container">
    <section class="form">
        <h1>{{ _('Recuperar contraseña') }}</h1>
        <form method="post">
            <label for="correo">{{ _('Correo de la cuenta') }}</label>
            <input id="correo" name="correo" type="email" autocomplete="email" required>
            <button type="submit" class="btn">{{ _('Enviar enlace') }}</button>
        </form>
        <p><a href="{{ url_for('login') }}">{{ _('Volver al inicio de sesión') }}</a></p>
    </section>
</main>
{% endblock %}
