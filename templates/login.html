{% extends "base.html" %}

{% block content %}

<div class="form">

    <h2>{{ _('Iniciar sesión') }}</h2>

    <p class="muted">
        {{ _('Ingresa con tu correo o número de documento.') }}
    </p>

    <form method="POST">

        <label>
            {{ _('Correo o documento') }}
        </label>

        <input
            type="text"
            name="login"
            required
        >

        <label>
            {{ _('Contraseña') }}
        </label>

        <input
            type="password"
            name="password"
            required
        >

        <button
            class="btn"
            type="submit"
        >
            {{ _('Ingresar') }}
        </button>

    </form>

    <br>

    <p>
        {{ _('¿No tienes una cuenta?') }}
        <a href="{{ url_for('registro') }}">
            {{ _('Registrarse') }}
        </a>
    </p>

    <p>
        <a href="{{ url_for('recuperar_cuenta') }}">{{ _('¿Olvidaste tu contraseña?') }}</a>
    </p>

</div>

{% endblock %}
