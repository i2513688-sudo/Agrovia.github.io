{% extends "base.html" %}

{% block title %}{{ _('Restablecer contraseña') }}{% endblock %}

{% block content %}
<main class="container">
    <section class="form">
        <h1>{{ _('Restablecer contraseña') }}</h1>
        <p class="muted">{{ _('Elige una nueva contraseña de al menos 8 caracteres.') }}</p>
        <form method="post" action="{{ url_for('restablecer_password', token=token) }}">
            <label for="password">{{ _('Nueva contraseña') }}</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <label for="confirmacion">{{ _('Confirmar contraseña') }}</label>
            <input id="confirmacion" name="confirmacion" type="password" autocomplete="new-password" minlength="8" required>
            <button type="submit" class="btn">{{ _('Guardar contraseña') }}</button>
        </form>
    </section>
</main>
{% endblock %}
