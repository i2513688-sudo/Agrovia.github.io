{% extends "base.html" %}
{% block title %}{{ _('Nueva contraseña') }}{% endblock %}
{% block content %}
<main class="container">
    <section class="form">
        <h1>{{ _('Crear nueva contraseña') }}</h1>
        <form method="post">
            <label for="password">{{ _('Nueva contraseña') }}</label>
            <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
            <label for="confirmacion">{{ _('Confirmar contraseña') }}</label>
            <input id="confirmacion" name="confirmacion" type="password" minlength="8" autocomplete="new-password" required>
            <button type="submit" class="btn">{{ _('Actualizar contraseña') }}</button>
        </form>
    </section>
</main>
{% endblock %}
